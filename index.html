<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Sign up | Skill Arena</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body data-page="index"><div id="nav"></div>
<main><div class="split">
<section><h2>Login</h2><p class="sub">Welcome back!</p>
<form id="loginForm" novalidate>
<div class="mb-2"><label for="id">Email / Username</label><input id="id" name="id" class="form-control" autocomplete="username"></div>
<div class="mb-2"><label for="lp">Password</label><input id="lp" name="password" type="password" class="form-control" autocomplete="current-password"></div>
<div class="row2"><label style="font-weight:400"><input type="checkbox" data-show="1"> Show password</label><a href="#" id="forgot">Forgot password?</a></div>
<button class="btn-main" type="submit">Login</button></form>
<div class="or">or</div><button class="btn-ghost" id="google" type="button">Continue with Google</button>
<p class="hint">Demo login: student@skillarena.com / Student@123</p>
<p style="text-align:center;margin-top:1rem">New here? <a href="#" id="toSign">Create an account</a></p></section>
<section><h2>Sign Up</h2><p class="sub">Create your account</p>
<form id="signForm" novalidate>
<div class="mb-2"><label for="sn">Full name</label><input id="sn" name="name" class="form-control" autocomplete="name"></div>
<div class="mb-2"><label for="se">Email</label><input id="se" name="email" class="form-control" autocomplete="email"></div>
<div class="mb-2"><label for="sph">Phone number</label><input id="sph" name="phone" class="form-control" inputmode="numeric" autocomplete="tel"></div>
<div class="mb-2"><label for="sp">Password</label><input id="sp" name="password" type="password" class="form-control" autocomplete="new-password"></div>
<div class="row2"><label style="font-weight:400"><input type="checkbox" data-show="1"> Show password</label></div>
<button class="btn-main" type="submit">Sign Up</button></form>
<p style="text-align:center;margin-top:1rem">Already have an account? <a href="#" id="toLogin">Login</a></p></section></div></main>
<div id="foot"></div><script src="js/data.js"></script><script src="js/validation.js"></script><script src="js/app.js"></script></body></html>
